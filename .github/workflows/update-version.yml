name: Auto version
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    # Only run the bump when the commit message contains [release]
    # or when you manually trigger the workflow
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, update files & tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          NEW_VERSION="v$MAJOR.$((MINOR+1)).0"

          sed -i "s/const V := \".*\"/const V := \"${NEW_VERSION#v}\"/" *.gd

          HASH=$(sha256sum *.gd | cut -d' ' -f1)
          echo "{\"version\":\"${NEW_VERSION#v}\",\"hash\":\"$HASH\"}" > version.json

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.gd version.json
          git commit -m "chore: bump version to $NEW_VERSION" || exit 0
          git tag "$NEW_VERSION"
          git push origin HEAD --tags